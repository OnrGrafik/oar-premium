<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OAR Premium — Multi-Agent Quant OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:#07090a;color:#cdd9d8;font-family:'Inter',system-ui,-apple-system,sans-serif;font-size:13px;-webkit-font-smoothing:antialiased;font-feature-settings:'tnum'}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#1c2625;border-radius:5px}
::-webkit-scrollbar-track{background:#0a0d0e}
@keyframes oarblink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes oarticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes oarfeedin{0%{opacity:0;transform:translateY(-7px)}100%{opacity:1;transform:translateY(0)}}
@keyframes oarpulse{0%,100%{opacity:.5}50%{opacity:1}}
.info-tip{position:relative}
.info-tip::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#131918;border:1px solid #1c302a;color:#b8c6c3;font-size:10px;line-height:1.45;padding:7px 10px;border-radius:6px;white-space:pre-wrap;width:220px;z-index:999;pointer-events:none;opacity:0;transition:opacity .15s}
.info-tip:hover::after{opacity:1}
.sg{font-family:'Space Grotesk',sans-serif}
.navbtn{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:7px;border:1px solid transparent;background:none;color:#8a9c99;font-family:'Inter',system-ui,sans-serif;font-size:12px;cursor:pointer;width:100%;transition:.15s}
.navbtn:hover{filter:brightness(1.3)}
.navbtn.active{background:#10171680;border-color:#1c302a;color:#eaf4f2}
.card{background:#0c1112;border:1px solid #18211f;border-radius:9px}
input,button{font-family:'Inter',system-ui,sans-serif}
a{color:inherit;text-decoration:none}
/* ═══ OPSİYON MASASI (Options Desk teması — yalnız .od kapsamı) ═══ */
.od{
  --od-bg:#07090a;--od-surface:#0c1112;--od-surface-2:#131918;
  --od-line:#18211f;--od-line-soft:#131918;--od-line-strong:#1a2422;
  --od-text:#cdd9d8;--od-text-2:#b8c6c3;--od-dim:#8a9c99;--od-mute:#5e716f;
  --od-accent:#1ff0ad;--od-pos:#1ff0ad;--od-neg:#ff5d6c;--od-neutral:#9fb0ad;
  --od-serif:'Space Grotesk',sans-serif;
  --od-sans:'Inter',system-ui,sans-serif;
  --od-mono:'JetBrains Mono',ui-monospace,monospace;
  margin:-18px -20px -28px;padding:26px 34px 40px;
  background:var(--od-bg);color:var(--od-text);
  font-family:var(--od-sans);font-size:13px;min-height:calc(100vh - 46px);
}
.od *{box-sizing:border-box}
.od .pos{color:var(--od-pos)!important}.od .neg{color:var(--od-neg)!important}

.od-top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:24px}
.od-title{font-family:var(--od-serif);font-size:30px;font-weight:400;letter-spacing:-.01em;color:var(--od-text);line-height:1}
.od-sub{font-size:12px;color:var(--od-dim)}
.od-vade{margin-left:auto;display:flex;gap:5px}
.od-chip{padding:4px 11px;background:var(--od-surface-2);border:1px solid var(--od-line);color:var(--od-dim);font-family:var(--od-sans);font-size:12px;font-weight:500;cursor:pointer;letter-spacing:.03em;transition:.15s}
.od-chip:hover{color:var(--od-text);border-color:var(--od-line-strong)}
.od-chip.on{background:var(--od-accent);border-color:var(--od-accent);color:#07090a;font-weight:700}

.od-sec{padding:30px 0 4px;border-top:1px solid var(--od-line);margin-top:24px}
.od-sec:first-of-type{border-top:none;margin-top:0;padding-top:4px}
.od-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px;padding-bottom:12px;border-bottom:1px solid var(--od-line-soft)}
.od-h2{font-family:var(--od-serif);font-size:21px;font-weight:400;line-height:1;color:var(--od-text);letter-spacing:-.01em;margin:0}
.od-nbr{font-family:var(--od-serif);color:var(--od-accent);font-style:italic;margin-right:10px}
.od-meta{font-size:10px;font-weight:600;color:var(--od-dim);letter-spacing:.08em;text-transform:uppercase}

.od-pull{font-family:var(--od-serif);font-size:23px;line-height:1.35;color:var(--od-text-2);max-width:62ch;margin:0}
.od-pull em{font-style:italic;color:var(--od-accent)}

.od-wrap{display:grid;grid-template-columns:1.75fr 1fr;gap:38px}
.od-two{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.od-walls{display:grid;grid-template-columns:1fr 280px;gap:34px}
@media(max-width:1100px){.od-wrap,.od-two,.od-walls{grid-template-columns:1fr}}

.od-ladder{display:flex;flex-direction:column;font-family:var(--od-sans);font-size:12px;width:100%}
.od-lhead,.od-lrow{display:grid;grid-template-columns:40px 50px 1fr 84px 1fr 70px 58px;align-items:center}
.od-lhead{padding:7px 0;border-bottom:1px solid var(--od-line);color:var(--od-mute);font-size:10px;font-weight:700;letter-spacing:.10em;text-transform:uppercase}
.od-lhead>div:nth-child(3){text-align:right;padding-right:13px}
.od-lhead>div:nth-child(5){text-align:left;padding-left:13px}
.od-lrow{padding:5px 0;border-bottom:1px solid var(--od-line-soft);color:var(--od-text-2);cursor:crosshair;transition:background .1s}
.od-lrow:hover{background:var(--od-surface-2)}
.od-lrow.spot{background:rgba(196,165,116,.08);border-top:1px solid var(--od-accent);border-bottom:1px solid var(--od-accent);color:var(--od-text)}
.od-tag{font-size:10px;font-weight:700;color:var(--od-mute);text-align:center;letter-spacing:.05em}
.od-tag.cw{color:var(--od-pos)}.od-tag.pw{color:var(--od-neg)}.od-tag.mp{color:var(--od-accent)}.od-tag.zg{color:var(--od-neutral)}
.od-ap{font-size:12px;font-weight:700;color:var(--od-dim);text-align:center}
.od-bar{height:16px;display:flex;align-items:center}
.od-bar.put{justify-content:flex-end;padding-right:13px}
.od-bar.call{justify-content:flex-start;padding-left:13px}
.od-fill{height:9px;border-radius:1px;opacity:.85}
.od-fill.call{background:var(--od-pos)}.od-fill.put{background:var(--od-neg)}
.od-strike{font-size:13px;font-weight:700;color:var(--od-text);text-align:right;padding-right:15px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.od-lrow.spot .od-strike{color:var(--od-accent)}
.od-net{font-size:12px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.od-dist{font-size:10px;font-weight:500;color:var(--od-dim);text-align:right;font-variant-numeric:tabular-nums}
.od-dist.pos{color:#6f9a7e}.od-dist.neg{color:#a86a60}

.od-sheet-label{font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--od-mute);margin-bottom:10px}
.od-lvl{display:grid;grid-template-columns:10px 1fr auto auto;gap:12px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--od-line-soft)}
.od-lvl:last-child{border-bottom:none}
.od-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.od-lname{font-size:12px;font-weight:500;color:var(--od-text)}
.od-lsub{font-size:10px;color:var(--od-mute);margin-left:5px}
.od-lval{font-size:13px;font-weight:700;color:var(--od-text);font-family:var(--od-mono)}
.od-ldelta{font-size:12px;font-weight:700;color:var(--od-dim);min-width:54px;text-align:right;font-variant-numeric:tabular-nums}
.od-ldelta.pos{color:var(--od-pos)}.od-ldelta.neg{color:var(--od-neg)}

.od-greeks{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:20px 0}
.od-greek{padding:22px 30px 22px 0;border-right:1px solid var(--od-line)}
.od-greek:last-child{border-right:none;padding-right:0}
.od-greek-agg{margin-top:16px;padding:14px 18px;border-left:3px solid var(--od-acc,#6af);background:rgba(100,160,255,.06);border-radius:6px;font-size:12px;line-height:1.6;color:var(--od-text,#cfd6e4)}
.od-glyph{font-family:var(--od-serif);font-style:italic;font-size:24px;color:var(--od-accent);margin-bottom:6px;line-height:1}
.od-glabel{font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--od-mute);margin-bottom:12px}
.od-gnum{font-family:var(--od-serif);font-size:36px;line-height:1;color:var(--od-text);margin-bottom:8px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.od-gfoot{font-size:10px;font-weight:600;color:var(--od-dim);line-height:1.55}

.od-empty{color:var(--od-mute);font-size:12px;padding:26px;text-align:center}
.od-note{font-size:10px;color:var(--od-dim);line-height:1.6;margin-top:8px;background:var(--od-surface);border:1px solid var(--od-line);padding:10px 14px}
.od-cvd-h{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.od-cvd-t{font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--od-mute);text-transform:uppercase}
.od-pill{padding:2px 10px;border-radius:2px;font-size:10px;font-weight:700;letter-spacing:.06em;color:#fff}
.od-flow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.od-flow-c{background:var(--od-surface);border:1px solid var(--od-line);padding:10px 12px;display:flex;justify-content:space-between;align-items:baseline}
.od-flow-l{font-size:10px;color:var(--od-mute)}
.od-flow-v{font-family:var(--od-serif);font-size:16px;color:var(--od-text)}
.od-scn{display:grid;grid-template-columns:1fr auto;gap:16px;padding:11px 0;border-bottom:1px solid var(--od-line-soft)}
.od-foot{display:flex;justify-content:space-between;align-items:flex-end;padding:14px 0 0;border-top:1px solid var(--od-line);margin-top:26px;font-size:10px;color:var(--od-mute)}
.od-foot-pg{font-family:var(--od-serif);font-style:italic;color:var(--od-accent);font-size:16px}
</style>
</head>
<body>
<div style="display:flex;height:100vh;width:100vw;overflow:hidden;background:#07090a">

  <!-- SIDEBAR -->
  <aside style="width:230px;flex-shrink:0;background:#090c0d;border-right:1px solid #161e1d;display:flex;flex-direction:column">
    <div style="padding:17px 17px 15px;border-bottom:1px solid #141b1a;display:flex;align-items:center;gap:11px">
      <div class="sg" style="width:31px;height:31px;border-radius:8px;background:linear-gradient(140deg,#1ff0ad,#0a8f66);display:flex;align-items:center;justify-content:center;font-weight:700;color:#04130d;font-size:15px;box-shadow:0 0 16px rgba(21,224,160,.25)">◆</div>
      <div>
        <div class="sg" style="font-weight:700;font-size:15px;letter-spacing:.03em;color:#eaf4f2;line-height:1">OAR<span style="color:#1ff0ad"> PREMIUM</span></div>
        <div style="font-size:8.5px;letter-spacing:.16em;color:#4a5b59;margin-top:5px">MULTI-AGENT QUANT OS</div>
      </div>
    </div>
    <nav id="nav" style="padding:11px 9px;display:flex;flex-direction:column;gap:3px"></nav>
    <div style="margin-top:auto;padding:12px 13px 13px;border-top:1px solid #141b1a">
      <div style="margin-top:0;display:flex;align-items:center;gap:7px;font-size:9.5px;color:#5e716f">
        <span style="width:6px;height:6px;border-radius:50%;background:#56a8ff"></span>
        <span>OAR Asia Range Sistemi</span>
      </div>
    </div>
  </aside>

  <div style="flex:1;display:flex;flex-direction:column;min-width:0">
    <!-- HEADER TICKER -->
    <header style="height:46px;flex-shrink:0;border-bottom:1px solid #161e1d;background:#090c0d;display:flex;align-items:center;overflow:hidden">
      <div style="flex:1;overflow:hidden;height:100%;position:relative;-webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)">
        <div id="ticker" style="display:flex;width:max-content;animation:oarticker 55s linear infinite"></div>
      </div>
      <div style="display:flex;align-items:center;gap:15px;padding:0 18px;border-left:1px solid #161e1d;height:100%;flex-shrink:0">
        <span style="font-size:12px;color:#6f8180">TR <span id="clock" style="color:#cdd9d8">—</span></span>
        <span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#1ff0ad"><span style="width:7px;height:7px;border-radius:50%;background:#1ff0ad;animation:oarblink 1.6s infinite"></span>CANLI</span>
      </div>
    </header>

    <main id="screen" style="flex:1;overflow-y:auto;padding:18px 20px 28px"></main>
  </div>
</div>

<script>
// ════════════ STATE ════════════
const _VALID_TABS=['leader','options','macro'];
const _ilkTab=(()=>{try{const t=localStorage.getItem('oar_tab');return _VALID_TABS.includes(t)?t:'leader';}catch(e){return 'leader';}})();
const ST = {tab:_ilkTab, clock:'', chat:[], feed:[], signals:[], report:{}, ctx:{}, theories:[], selTheory:null, kbQuery:''};
const API = '';

const NAV = [
  {id:'leader',  icon:'◆', label:'Komuta Merkezi'},
  {id:'options', icon:'∑', label:'Opsiyon & GEX'},
  {id:'macro',   icon:'▦', label:'Makro Ekonomi'},
  // 'Canlı Panel' ve 'Bilgi / Hafıza' sekmeleri KALDIRILDI (kullanıcı isteği):
  // tüm ajanlar Telegram'da, kitap/hafıza sorunu çözüldü. Erişim sorununu lider
  // Telegram'dan bildirir.
];

const BOTS = [
  {name:'OAR Kombo',    tf:'5m',  dot:'#f43f5e', tip:'sinyal'},
  {name:'OAR Pattern',  tf:'15m', dot:'#1ff0ad', tip:'sinyal'},
  {name:'MA Scanner',   tf:'1d',  dot:'#ffb13c', tip:'sinyal'},
  {name:'CVD Scanner',  tf:'10m', dot:'#8b5cf6', tip:'sinyal'},
  {name:'Asia Ekstrem', tf:'15m', dot:'#56a8ff', tip:'sinyal'},
  {name:'Volume Bot',   tf:'1h',  dot:'#ec4899', tip:'sinyal'},
  {name:'Balina Bot',   tf:'tick',dot:'#06b6d4', tip:'bilgi'},
  {name:'Korelasyon',   tf:'1d',  dot:'#84cc16', tip:'bilgi'},
  {name:'Whale Tracker',tf:'tick',dot:'#f97316', tip:'bilgi'},
  {name:'Makro Alarm',  tf:'4h',  dot:'#a855f7', tip:'bilgi'},
];

// ════════════ HELPERS ════════════
const $ = id => document.getElementById(id);
async function jget(u){try{const r=await fetch(API+u);return await r.json();}catch(e){return null;}}
async function jpost(u,b){try{const r=await fetch(API+u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});return await r.json();}catch(e){return null;}}
function esc(s){return (s||'').replace(/</g,'&lt;');}
function fmtNum(n){return Number(n).toLocaleString('en-US');}

// Sparkline SVG
function spark(vals,color,w,hh){
  vals=(vals||[]).map(Number).filter(v=>isFinite(v));
  if(vals.length<2)return '<div style="height:'+(hh||40)+'px;display:flex;align-items:center;justify-content:center;color:#5e716f;font-size:9px">yeterli veri yok</div>';
  const min=Math.min(...vals),max=Math.max(...vals),rng=(max-min)||1;
  const pts=vals.map((v,i)=>[(i/(vals.length-1))*w,hh-2-((v-min)/rng)*(hh-4)]);
  const line='M'+pts.map(p=>(isFinite(p[0])?p[0]:0).toFixed(1)+' '+(isFinite(p[1])?p[1]:hh/2).toFixed(1)).join(' L ');
  const id='sp'+Math.round(Math.random()*1e6);
  return `<svg width="100%" height="${hh}" viewBox="0 0 ${w} ${hh}" preserveAspectRatio="none" style="display:block">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity="0.3"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${line} L ${w} ${hh} L 0 ${hh} Z" fill="url(#${id})"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
}

// ════════════ NAV + RAIL ════════════
function renderNav(){
  $('nav').innerHTML = NAV.map(n=>`
    <button class="navbtn ${ST.tab===n.id?'active':''}" onclick="go('${n.id}')">
      <span style="width:17px;display:flex;justify-content:center;flex-shrink:0">${n.icon}</span>
      <span style="flex:1;text-align:left">${n.label}</span>
    </button>`).join('');
}
function go(tab){ST.tab=tab;try{localStorage.setItem('oar_tab',tab);}catch(e){}renderNav();render();if(tab==='knowledge')loadKnowledge();if(tab==='options')loadOptionsFull();if(tab==='macro')loadMakro();if(tab==='live'&&!ST.theoryHipotez)loadTheoryHipotez();}

// ════════════ TICKER ════════════
async function loadTicker(){
  const d = await jget('/api/ticker');
  let items = [];
  if(d && d.items){
    items = d.items.map(c=>({sym:c.sym,
      price: c.sym==='Altın'||c.sym==='Gümüş'||c.sym==='VIX'?('$'+fmtNum(c.price)):(c.price>100?('$'+fmtNum(Math.round(c.price))):('$'+c.price)),
      chg:(c.chg>=0?'+':'')+c.chg+'%',
      col:c.chg>=0?'#1ff0ad':'#ff5d6c'}));
  }
  if(!items.length)items=[{sym:'BTC',price:'—',chg:'',col:'#9fb0ad'}];
  const html = items.map(t=>`<span style="display:inline-flex;align-items:center;gap:7px;padding:0 15px;border-right:1px solid #131918;height:46px">
    <span style="color:#9fb0ad;font-weight:600">${t.sym}</span><span style="color:#cdd9d8">${t.price}</span><span style="color:${t.col};font-size:12px">${t.chg}</span></span>`).join('');
  $('ticker').innerHTML = html+html;
}

function tickClock(){
  const now=new Date();
  const tr=new Date(now.toLocaleString('en-US',{timeZone:'Europe/Istanbul'}));
  ST.clock=tr.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  if($('clock'))$('clock').textContent=ST.clock;
}

// ════════════ SCREENS ════════════
function render(){
  if(document.fullscreenElement){return;}  // tam ekrandayken DOM'u yeniden kurma (grafiği söker)
  const m=$('screen');
  if(ST.tab==='leader'){m.innerHTML=scrLeader();setTimeout(initKomutaGrafikler,0);}
  else if(ST.tab==='options')m.innerHTML=scrOptions();
  else if(ST.tab==='knowledge')m.innerHTML=scrKnowledge();
  else if(ST.tab==='live')m.innerHTML=scrLive();
  else if(ST.tab==='macro')m.innerHTML=scrMacro();
}

// ─── KOMUTA MERKEZİ: GRAFİK + SKOR PANELİ ───
// ─── KOMUTA MERKEZİ (v3) ───

// ─── KOMUTA MERKEZİ: 4 GÜVENİLİRLİK KUTUSU (Top-50 coin) ───
function komutaKutulariHtml(){
  const km=ST.komuta||{};
  const kutular=km.kutular||{};
  // Soldan sağa: Yüksek → Güvenli → Orta → Az
  // Göreli (percentile) kovalar — sabit eşik değil, taranan 20 coine göre güç sırası
  const sira=[
    {ad:'yuksek',  baslik:'YÜKSEK GÜVENİLİR', renk:'#1ff0ad', aralik:'Üst %15'},
    {ad:'guvenli', baslik:'GÜVENLİ',          renk:'#7af0c4', aralik:'%15–40'},
    {ad:'orta',    baslik:'ORTA GÜVENİLİR',   renk:'#ffb13c', aralik:'%40–75'},
    {ad:'az',      baslik:'AZ GÜVENİLİR',     renk:'#5e716f', aralik:'Alt %25'},
  ];
  const kart=(c,renk)=>{
    const yon=c.yon||'NO_TRADE';
    const yRenk=yon==='LONG'?'#1ff0ad':yon==='SHORT'?'#ff5d6c':'#5e716f';
    const flash=(km.gecisler||[]).includes(c.sembol);
    const d24=c.degisim_24h;
    // Pozisyon yönüne göre TÜM kart rengi: LONG → yeşil, SHORT → kırmızı, yoksa nötr
    const kartBg=yon==='LONG'?'rgba(31,240,173,.08)':yon==='SHORT'?'rgba(255,93,108,.08)':'#0a0f0f';
    const kartBorder=flash?renk:(yon==='LONG'?'#1c4434':yon==='SHORT'?'#4a2026':'#18211f');
    return `<div title="${esc((c.nedenler||[]).join(' | '))}" style="display:flex;align-items:center;gap:5px;padding:5px 7px;border-radius:6px;background:${kartBg};border:1px solid ${kartBorder};border-left:3px solid ${yRenk}">
      ${flash?'<span style="font-size:10px">🚨</span>':''}

// 📷 ekran görüntüsü: grafik + overlay birleşik PNG
function kSS(sym){
  const c=_kcharts[sym];if(!c)return;
  try{
    const sc=c.ch.takeScreenshot();
    const ov=document.getElementById('kover-'+sym);
    const out=document.createElement('canvas');
    out.width=sc.width;out.height=sc.height;
    const g=out.getContext('2d');
    g.drawImage(sc,0,0);
    if(ov)g.drawImage(ov,0,0,ov.width,ov.height,0,0,sc.width,sc.height);
    const a=document.createElement('a');
    a.download=sym.replace('USDT','')+'_OAR_'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')+'.png';
    a.href=out.toDataURL('image/png');a.click();
  }catch(e){console.warn('ss hata',e);}
}

let _kcharts={};
// TR (UTC+3) gün-içi dakika
function _trDak(tsSec){const d=new Date((tsSec+3*3600)*1000);return d.getUTCHours()*60+d.getUTCMinutes();}
function _trGun(tsSec){return Math.floor((tsSec+3*3600)/86400);} // TR takvim günü no
// Seans tanımları (OAR indikatörü ile birebir, TR saati)
const K_SEANS=[
  {ad:'Asia',    b:180,  e:420,  renk:'#f44336'},
  {ad:'London Open', b:540, e:720, renk:'#2196f3'},
  {ad:'NY Open', b:840,  e:1020, renk:'#4caf50'},
  {ad:'London Close', b:1020, e:1140, renk:'#2196f3'},
  {ad:'NY Close',b:1230, e:1380, renk:'#4caf50'},
  {ad:'CBDR',    b:1380, e:1620, renk:'#ff9800'},  // 23:00 → 03:00 (+1 gün)
];
const K_TZ=10800; // grafik ekseni TR saati göstersin diye kaydırma
const K_FIB=[[2.618,'#4caf50'],[2.272,'#4caf50'],[1.618,'#2196f3'],[1.377,'#9e9e9e'],[1.0,'#4caf50'],[0.5,'#9c27b0'],[0.0,'#4caf50'],[-0.377,'#9e9e9e'],[-0.618,'#2196f3'],[-1.272,'#f44336'],[-1.618,'#f44336']];
const K_FONT='"Inter",system-ui,sans-serif';

async function initKomutaGrafikler(){
  if(typeof LightweightCharts==='undefined')return;
  for(const sym of ['BTCUSDT','ETHUSDT']){
    const el=document.getElementById('kchart-'+sym);
    if(!el||el.dataset.init)continue;
    el.dataset.init='1';
    if(_kcharts[sym]&&_kcharts[sym].ch){try{_kcharts[sym].ch.remove();}catch(e){}}
    const ch=LightweightCharts.createChart(el,{
      layout:{background:{color:'#ffffff'},textColor:'#555',fontFamily:K_FONT,fontSize:11},
      grid:{vertLines:{color:'#f0f0f0'},horzLines:{color:'#f0f0f0'}},
      timeScale:{borderColor:'#ddd',timeVisible:true,rightOffset:14},
      rightPriceScale:{borderColor:'#ddd'},
      width:el.clientWidth,height:340});
    const ca=ch.addCandlestickSeries({upColor:'#ffffff',downColor:'#111111',
      borderUpColor:'#111111',borderDownColor:'#111111',wickUpColor:'#111111',wickDownColor:'#111111'});
    const vw=ch.addLineSeries({color:'#2962FF',lineWidth:2,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false,visible:_kAyar.oar&&_kAyar.vwap});
    _kcharts[sym]={ch,ca,vw,kutular:[]};
    const ciz=()=>kOverlayCiz(sym);
    ch.timeScale().subscribeVisibleLogicalRangeChange(ciz);
    new ResizeObserver(()=>{try{ch.applyOptions({width:el.clientWidth});ciz();}catch(e){}}).observe(el);
    // dikey pan/zoom (fiyat ekseni) hiçbir event vermiyor → rAF döngüsüyle sürekli senkron çiz
    (function dongu(){
      if(!document.body.contains(el)){try{ch.remove();}catch(e){}return;}
      kOverlayCiz(sym);
      requestAnimationFrame(dongu);
    })();
    kGrafikVeri(sym);
  }
}

async function kGrafikVeri(sym,zorla){
  const c=_kcharts[sym];if(!c)return;
  ST.kgraf=ST.kgraf||{};
  let d=ST.kgraf[sym];
  if(zorla||!d||Date.now()-d.ts>20000){
    const cur=sym.startsWith('BTC')?'BTC':'ETH';
    const tf=_kTFMap[_kTF]||_kTFMap['5m'];
    const[oh,oh1h,oh1d,lv,vm]=await Promise.all([
      jget('/api/ohlcv?symbol='+sym+'&interval='+tf.iv+'&limit='+tf.limit),
      jget('/api/ohlcv?symbol='+sym+'&interval=1h&limit=240'),
      jget('/api/ohlcv?symbol='+sym+'&interval=1d&limit=370'),
      jget('/api/options/levels?currency='+cur),
      jget('/api/options/vade-masasi?currency='+cur)]);
    d={ts:Date.now(),oh,oh1h,oh1d,lv,vm};ST.kgraf[sym]=d;
  }
  if(!_kcharts[sym]||_kcharts[sym]!==c)return;
  const mumlar=(d.oh&&d.oh.candles)||[];
  if(!mumlar.length)return;
  const M=mumlar.map(x=>({t:Math.floor(x.ts/1000),o:x.open,h:x.high,l:x.low,c:x.close,v:x.volume||0}));
  c.ca.setData(M.map(x=>({time:x.t+K_TZ,open:x.o,high:x.h,low:x.l,close:x.c})));
  const spot=M[M.length-1].c, sonTs=M[M.length-1].t;
  c.sonTs=sonTs;

  // ── VWAP(D): yalnız BUGÜNE ait (TR 03:00 çapası = UTC gün başı)
  const bugunAnc=Math.floor(sonTs/86400);
  let cv=0,cpv=0;const vwd=[];
  for(const x of M){
    if(Math.floor(x.t/86400)!==bugunAnc)continue;
    const hlc=(x.h+x.l+x.c)/3;cv+=x.v;cpv+=hlc*x.v;
    if(cv>0)vwd.push({time:x.t+K_TZ,value:cpv/cv});
  }
  c.vw.setData(vwd);

  // ── Seans kutuları (son 3 gün)
  const kutular=[];
  const esik=sonTs-3*86400;
  for(const sn of K_SEANS){
    let grup=null;
    for(const x of M){
      if(x.t<esik)continue;
      let dk=_trDak(x.t);
      let icinde=sn.e<=1440?(dk>=sn.b&&dk<sn.e):(dk>=sn.b||dk<(sn.e-1440));
      if(icinde){
        if(!grup)grup={t1:x.t,t2:x.t,hi:x.h,lo:x.l};
        else{grup.t2=x.t;grup.hi=Math.max(grup.hi,x.h);grup.lo=Math.min(grup.lo,x.l);}
      }else if(grup){kutular.push({...grup,ad:sn.ad,renk:sn.renk});grup=null;}
    }
    if(grup)kutular.push({...grup,ad:sn.ad,renk:sn.renk});
  }
  c.kutular=kutular;

  // ── Fib: Asia H/L'den (oluşurken önceki tamamlanmış Asia)
  const asialar=kutular.filter(k=>k.ad==='Asia');
  const sonDk=_trDak(sonTs);
  const asiaSuruyor=sonDk>=180&&sonDk<420;
  const fibAsia=(asiaSuruyor&&asialar.length>1)?asialar[asialar.length-2]:asialar[asialar.length-1];
  c.fibler=[];c.fibT1=null;
  if(fibAsia){
    c.fibT1=fibAsia.t1;
    const r=fibAsia.hi-fibAsia.lo;
    for(const[v,col]of K_FIB){
      const pf=fibAsia.lo+r*v;
      if(Math.abs(pf-spot)/spot>0.30)continue;
      c.fibler.push({p:pf,v:v,col:col});
    }
  }

  // ── KEY LEVELS — OAR indikatöründeki TÜM seviyeler
  //    Midnight/Two/Twao (07:00 TR açılışı) · DO/WO/MO/QO · PDH/PDL · PWH/PWL · Monday H/L/EQ
  const bugun=_trGun(sonTs);
  const H1=((d.oh1h&&d.oh1h.candles)||[]).map(x=>({t:Math.floor(x.ts/1000),o:x.open,h:x.high,l:x.low}));
  const D1=((d.oh1d&&d.oh1d.candles)||[]).map(x=>({t:Math.floor(x.ts/1000),o:x.open,h:x.high,l:x.low}));
  c.keyLvl=[];
  const ekle=(pv,adx,col)=>{if(pv!=null&&isFinite(pv)&&Math.abs(pv-spot)/spot<=0.30)c.keyLvl.push({p:pv,ad:adx,col:col});};
  // Midnight: bugün 07:00 TR açılışı (5m)
  let mid=null,doV=null;
  for(const x of M){
    const g=_trGun(x.t),dk=_trDak(x.t);
    if(g===bugun&&dk===420&&mid==null)mid=x.o;
    if(g===bugun&&dk===180&&doV==null)doV=x.o;
  }
  // Two/Twao: bu haftanın Pazartesi/Salı 07:00 TR açılışı (1h: 04:00 UTC barı)
  let two=null,twao=null;
  for(const x of H1){
    const dt=new Date((x.t+K_TZ)*1000);
    if(dt.getUTCHours()===7){
      const gd=dt.getUTCDay(); // TR günü
      const gunNo=_trGun(x.t);
      if(gunNo>bugun-7){
        if(gd===1)two=x.o;
        if(gd===2)twao=x.o;
      }
    }
  }
  // Günlük seriden: DO(yedek)/PDH/PDL/WO/MO/QO/PWH-PWL/Monday
  let pdh=null,pdl=null,wo=null,mo=null,qo=null,pwh=null,pwl=null,monH=null,monL=null;
  if(D1.length>=2){
    const son=D1[D1.length-1], onceki=D1[D1.length-2];
    if(doV==null)doV=son.o;
    pdh=onceki.h;pdl=onceki.l;
    const dGun=t=>new Date((t+K_TZ)*1000);
    // bu haftanın Pazartesisi
    const bugunDt=dGun(son.t);const dow=bugunDt.getUTCDay()||7;
    const monIdx=D1.length-1-(dow-1);
    if(monIdx>=0){wo=D1[monIdx].o;monH=D1[monIdx].h;monL=D1[monIdx].l;}
    // önceki hafta H/L
    if(monIdx>=1){
      let ph=-1e18,pl=1e18;
      for(let i=Math.max(0,monIdx-7);i<monIdx;i++){ph=Math.max(ph,D1[i].h);pl=Math.min(pl,D1[i].l);}
      if(ph>-1e17){pwh=ph;pwl=pl;}
    }
    // ay/çeyrek açılışı
    for(const x of D1){
      const dt=dGun(x.t);
      if(dt.getUTCDate()===1){
        const ay=dt.getUTCMonth();
        if(dt.getUTCFullYear()===bugunDt.getUTCFullYear()&&ay===bugunDt.getUTCMonth())mo=x.o;
        if([0,3,6,9].includes(ay)){qo=x.o;}
      }
    }
  }
  // NAKED kuralı (indikatörle aynı): temas edilen PDH/PDL/PWH/PWL çizilmez.
  // PD: bugünün mumları (5m) · PW: bu haftanın mumları (1h, Pazartesi'den itibaren)
  const temas=(pv,arr)=>pv!=null&&arr.some(x=>x.l<=pv&&pv<=x.h);
  const bugunM=M.filter(x=>_trGun(x.t)===bugun);
  if(temas(pdh,bugunM))pdh=null;
  if(temas(pdl,bugunM))pdl=null;
  let haftaBasiTs=null;
  if(D1.length>=2){
    const dow2=new Date((D1[D1.length-1].t+K_TZ)*1000).getUTCDay()||7;
    const mi2=D1.length-1-(dow2-1);
    if(mi2>=0)haftaBasiTs=D1[mi2].t;
  }
  const haftaH1=haftaBasiTs!=null?H1.filter(x=>x.t>=haftaBasiTs):[];
  if(temas(pwh,haftaH1))pwh=null;
  if(temas(pwl,haftaH1))pwl=null;
  ekle(mid,'Midnight','#9e9e9e');
  ekle(two,'Two','#00a862');ekle(twao,'Twao','#00a862');
  ekle(doV,'DO','#757575');ekle(wo,'WO','#2196f3');ekle(mo,'MO','#ff9800');ekle(qo,'QO','#e91e63');
  ekle(pdh,'PDH','#ff5252');ekle(pdl,'PDL','#ff5252');
  ekle(pwh,'PWH','#00bcd4');ekle(pwl,'PWL','#00bcd4');
  if(monH!=null){ekle(monH,'Monday-H','#c9a227');ekle(monL,'Monday-L','#c9a227');ekle((monH+monL)/2,'Monday-EQ','#c9a227');}
  c.gunT1=(()=>{for(const x of M){if(_trGun(x.t)===bugun&&_trDak(x.t)>=180)return x.t;}return sonTs-86400;})();

  // ── Opsiyon seviyeleri: SİTEDEKİ 0DTE tablosuyla AYNI kaynak (vade-masasi)
  c.optLvl=[];
  const g0=((d.vm&&d.vm.gex_tablo)||[]).find(r=>r.vade==='0DTE')||{};
  const mp0=(d.vm&&d.vm.takvim&&d.vm.takvim[0])?d.vm.takvim[0].max_pain:null;
  const zg=(d.lv&&d.lv.kisa&&d.lv.kisa.zero_gamma)||null;
  [[g0.destek,'#0a8f66','0DTE Destek'],[g0.direnc,'#d32f2f','0DTE Direnç'],
   [mp0,'#f59e0b','Max Pain (0g)'],[zg,'#757575','Zero Gamma']].forEach(([pv,col,t])=>{
    if(pv!=null&&Math.abs(pv-spot)/spot<=0.30)c.optLvl.push({p:pv,ad:t,col:col});
  });

  // ── FRVP (kullanıcı ayarı): gün başından (DO, 03:00 TR) · 180 satır · Delta hacim · VA %70
  //    Bilimsel yöntem: her mumun hacmi/deltası, mumun [low,high] aralığının kestiği
  //    TÜM satırlara ORANTILI dağıtılır (tek-kutu yaklaşımı değil). Satır deltası İŞARETLİ
  //    birikir (alıcı-satıcı netleşir), çubuk boyu |net delta|. POC/VAH/VAL standart
  //    market-profile tanımıyla TOPLAM hacimden hesaplanır (VA %70, POC'tan iki yana genişleme).
  const gunBasi=Math.floor(sonTs/86400)*86400;   // TR 03:00 = UTC gün başı
  const vpM=M.filter(x=>x.t>=gunBasi);
  c.vp=null;
  if(vpM.length){
    let lo=Math.min(...vpM.map(x=>x.l)),hi=Math.max(...vpM.map(x=>x.h));
    if(hi>lo){
      const N=180,vol=new Array(N).fill(0),del=new Array(N).fill(0),adim=(hi-lo)/N;
      let deltaVar=false;
      for(const x of vpM){
        const v=x.v||0;
        const dRaw=(x.tbv!=null)?(2*x.tbv-v):null;
        if(dRaw!=null)deltaVar=true;
        const aralik=Math.max(x.h-x.l,1e-9);
        let i1=Math.floor((x.l-lo)/adim),i2=Math.floor((x.h-lo)/adim);
        i1=Math.max(0,Math.min(N-1,i1));i2=Math.max(0,Math.min(N-1,i2));
        for(let i=i1;i<=i2;i++){
          const s1=lo+i*adim,s2=s1+adim;
          const kes=Math.max(0,Math.min(x.h,s2)-Math.max(x.l,s1));
          const frac=(i1===i2)?1:(kes/aralik);
          vol[i]+=v*frac;
          if(dRaw!=null)del[i]+=dRaw*frac;
        }
      }
      // POC + Değer Alanı %70 — TOPLAM hacim üzerinden (standart tanım)
      const top=vol.reduce((a2,b2)=>a2+b2,0);
      let pocI=0;for(let i=0;i<N;i++)if(vol[i]>vol[pocI])pocI=i;
      let cum=vol[pocI],u=pocI,dn=pocI;
      while(cum<top*0.70&&(u<N-1||dn>0)){
        const yuk=u<N-1?vol[u+1]:-1, alt=dn>0?vol[dn-1]:-1;
        if(yuk>=alt&&u<N-1){u++;cum+=vol[u];}
        else if(dn>0){dn--;cum+=vol[dn];}
        else break;
      }
      // çubuk boyu: Delta modunda |net delta|, taker verisi yoksa toplam hacim
      const bar=deltaVar?del.map(Math.abs):vol.slice();
      c.vp={lo,hi,kova:bar,maxV:Math.max(...bar),t1:gunBasi,pocI,vahI:u,valI:dn};
    }
  }

  // 1g/1h TF'te tek mum tüm günü kapsar → gün-içi overlay (seans/Asia fib/VWAP/VP)
  // anlamsızlaşır; onları gizle. Key + opsiyon seviyeleri (çok-zamanlı) her TF'te kalır.
  if(_kTF==='1d'||_kTF==='1w'){
    c.kutular=[];c.fibler=[];c.fibT1=null;c.vp=null;
    try{c.vw.setData([]);}catch(e){}
  }

  // Görünür aralığı YALNIZ ilk yüklemede ayarla — sonraki tazelemelerde kullanıcının
  // zoom/pan'ini KORU (her 20-30sn veri gelince sıfırlanmasın).
  if(!c._aralikKuruldu){
    const bak=(_kTFMap[_kTF]||{}).bak||36*3600;
    try{c.ch.timeScale().setVisibleRange({from:sonTs-bak+K_TZ,to:sonTs+Math.round(bak*0.08)+K_TZ});}catch(e){try{c.ch.timeScale().fitContent();}catch(e2){}}
    c._aralikKuruldu=true;
  }
  setTimeout(()=>kOverlayCiz(sym),50);
}

// Seans kutuları + fib + key/opsiyon seviyeleri + volume profile — canvas overlay
function kOverlayCiz(sym){
  const c=_kcharts[sym];if(!c)return;
  const el=document.getElementById('kchart-'+sym),cv=document.getElementById('kover-'+sym);
  if(!el||!cv)return;
  const W=el.clientWidth,H=el.clientHeight,dpr=window.devicePixelRatio||1;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
  if(!_kAyar.oar)return;   // OAR indikatörü kapalı → temiz grafik (hiç overlay çizme)
  const ts=c.ch.timeScale();
  const xSon=ts.timeToCoordinate((c.sonTs||0)+K_TZ);
  const xBitis=(xSon!=null?xSon:W-70)+26;
  const fmtP=v=>v>=1000?v.toLocaleString('tr-TR',{maximumFractionDigits:1}):v.toFixed(2);

  // volume profile (en altta çizilir — arka plan)
  if(_kAyar.vp&&c.vp){
    const x0=ts.timeToCoordinate(c.vp.t1+K_TZ)??0;
    const maxW=Math.min(170,(xSon??W)-x0>0?((xSon??W)-x0)*0.4:130);
    const N=c.vp.kova.length,adim=(c.vp.hi-c.vp.lo)/N;
    for(let i=0;i<N;i++){
      if(!c.vp.kova[i])continue;
      const p1=c.vp.lo+i*adim,p2=p1+adim;
      const y1=c.ca.priceToCoordinate(p2),y2=c.ca.priceToCoordinate(p1);
      if(y1==null||y2==null)continue;
      const w=c.vp.maxV>0?(c.vp.kova[i]/c.vp.maxV)*maxW:0;
      // POC mavi · VAH/VAL siyah · kalan gri — kutu boyu kendi hacmi kadar
      g.fillStyle=i===c.vp.pocI?'rgba(41,98,255,.8)'
        :(i===c.vp.vahI||i===c.vp.valI)?'rgba(0,0,0,.75)'
        :'rgba(120,130,140,.33)';
      g.fillRect(x0,y1,w,Math.max(y2-y1-0.5,1));
    }
  }
  // seans kutuları
  if(_kAyar.seans)for(const kt of(c.kutular||[])){
    let x1=ts.timeToCoordinate(kt.t1+K_TZ),x2=ts.timeToCoordinate(kt.t2+K_TZ);
    const y1=c.ca.priceToCoordinate(kt.hi),y2=c.ca.priceToCoordinate(kt.lo);
    if(x1==null&&x2==null)continue;
    if(x1==null)x1=0;if(x2==null)x2=W-70;
    if(y1==null||y2==null)continue;
    g.save();
    g.strokeStyle=kt.renk;g.lineWidth=1;g.setLineDash([3,3]);
    g.globalAlpha=0.05;g.fillStyle=kt.renk;g.fillRect(x1,y1,x2-x1,y2-y1);
    g.globalAlpha=0.7;g.strokeRect(x1,y1,x2-x1,y2-y1);
    g.globalAlpha=1;g.setLineDash([]);
    g.font='700 9px '+K_FONT;g.fillStyle=kt.renk;g.textAlign='center';
    g.fillText(kt.ad,(x1+x2)/2,Math.max(y1-4,9));
    g.restore();
  }
  // lblX: etiketin yazılacağı x (varsayılan xBitis+4). Opsiyon seviyeleri kendi
  // ayrı sütununda (daha sağda) → OAR fib/key etiketleriyle iç içe girmez.
  // Çizgiyi hemen çiz; ETİKETİ topla → üst üste gelenler sonra YAN YANA yazılır.
  const mainLbl=[],optLbl=[];
  const seviye=(p,x1,etiket,col,dash,fs,lblX)=>{
    const y=c.ca.priceToCoordinate(p);if(y==null)return;
    g.save();
    g.strokeStyle=col;g.lineWidth=1;if(dash)g.setLineDash([4,4]);
    g.beginPath();g.moveTo(Math.max(x1,0),y);g.lineTo(xBitis,y);g.stroke();
    if(lblX){ // ayrı sütun → ince noktalı bağlayıcı çiz
      g.setLineDash([1,3]);g.globalAlpha=0.5;
      g.beginPath();g.moveTo(xBitis,y);g.lineTo(lblX-3,y);g.stroke();g.globalAlpha=1;
    }
    g.setLineDash([]);g.restore();
    (lblX?optLbl:mainLbl).push({y,x0:(lblX||(xBitis+4)),text:etiket,col,font:(fs||'9px')+' '+K_FONT});
  };
  const xFib=c.fibT1!=null?(ts.timeToCoordinate(c.fibT1+K_TZ)??0):0;
  if(_kAyar.fib)for(const f of(c.fibler||[]))seviye(f.p,xFib,`${f.v} (${fmtP(f.p)})`,f.col,false,'700 9.5px');
  const xGun=c.gunT1!=null?(ts.timeToCoordinate(c.gunT1+K_TZ)??0):0;
  if(_kAyar.key)for(const k of(c.keyLvl||[]))seviye(k.p,xGun,`${k.ad} (${fmtP(k.p)})`,k.col,true,'9px');
  // Opsiyon seviyeleri: ayrı sütun (OAR etiketlerinden ~115px daha sağda)
  const xOpt=xBitis+118;
  if(_kAyar.opt)for(const o of(c.optLvl||[]))seviye(o.p,xGun,`${o.ad} (${fmtP(o.p)})`,o.col,true,'700 9.5px',xOpt);
  // üst üste gelen etiketleri yan yana yerleştir
  _yerlestirEtiketler(g,mainLbl);
  _yerlestirEtiketler(g,optLbl);
}

// Aynı yüksekliğe düşen (üst üste binen) seviye etiketlerini tek satırda YAN YANA yaz.
// y'ye göre sırala; birbirine <11px yakın olanlar bir "satır" olur, ortalama y'de
// soldan sağa dizilir (her etiket öncekinin bittiği yerden + boşluk).
function _yerlestirEtiketler(g,list){
  if(!list||!list.length)return;
  list.sort((a,b)=>a.y-b.y);
  const TH=11,GAP=7;
  g.save();g.textAlign='left';
  let i=0;
  while(i<list.length){
    const satir=[list[i]];let j=i+1;
    while(j<list.length&&list[j].y-satir[satir.length-1].y<TH){satir.push(list[j]);j++;}
    const yA=(satir[0].y+satir[satir.length-1].y)/2;
    let x=satir[0].x0;
    for(const lb of satir){
      g.font=lb.font;g.fillStyle=lb.col;
      g.fillText(lb.text,x,yA+3);
      x+=g.measureText(lb.text).width+GAP;
    }
    i=j;
  }
  g.restore();
}

// OD palet (SVG + body'ye eklenen tooltip CSS değişkeni çözemez → hex)
const OD={bg:'#07090a',surf:'#0c1112',line:'#18211f',lineS:'#131918',lineH:'#1a2422',text:'#cdd9d8',t2:'#b8c6c3',dim:'#8a9c99',mute:'#5e716f',acc:'#1ff0ad',pos:'#1ff0ad',neg:'#ff5d6c',neu:'#9fb0ad',buy:'#56a8ff',sell:'#ff8a3c'};

// Hover tooltip (Options Desk yüzeyi)
function optTip(e,html){
  let t=document.getElementById('opt-tip');
  if(!t){t=document.createElement('div');t.id='opt-tip';
    t.style.cssText='position:fixed;z-index:9999;background:#0c1112;border:1px solid #1a2422;border-radius:4px;padding:9px 12px;font-family:ui-monospace,monospace;font-size:10px;color:#b8c6c3;pointer-events:none;box-shadow:0 6px 24px rgba(0,0,0,.6);max-width:240px;line-height:1.5';
    document.body.appendChild(t);}

  t.style.top=(e.clientY+14)+'px';
}
function optTipHide(){const t=document.getElementById('opt-tip');if(t)t.style.display='none';}

// kompakt sayı (K/M/Mr)
function odK(n){if(n==null||!isFinite(n))return '—';const x=Number(n),a=Math.abs(x),s=x<0?'-':'';if(a>=1e9)return s+(a/1e9).toFixed(2)+'Mr';if(a>=1e6)return s+(a/1e6).toFixed(1)+'M';if(a>=1e3)return s+(a/1e3).toFixed(0)+'K';return s+a.toFixed(0);}

// ── i. STRİKE TOPOGRAFYASI (merdiven) ──
// Dikey çubuk grafik: x=FİYAT ekseni (bar+etiket gerçek strike konumunda →
// etiket ile bar birebir eşleşir), üst yeşil / alt kırmızı ince bar, spot=mavi
// kesikli çizgi, Y-ekseni $ belirteçli gridline.
function odDikeyBar(vis,spot,fnUp,fnDn,fnTip,birim,notu){
  const ups=vis.map(fnUp),dns=vis.map(fnDn);
  const maxV=Math.max(...ups.map(Math.abs),...dns.map(Math.abs),1);
  const W=1000,H=310,PT=20,PB=30,PL=54,PR=14,cH=H-PT-PB,mid=PT+cH/2,halfH=cH/2;
  const n=vis.length,loK=vis[0].strike,hiK=vis[n-1].strike,rng=(hiK-loK)||1,plotW=W-PL-PR;
  const xC=K=>PL+(K-loK)/rng*plotW, xs=vis.map(s=>xC(s.strike));
  const gap=vis.map((s,i)=>{let g=plotW;if(i>0)g=Math.min(g,xs[i]-xs[i-1]);if(i<n-1)g=Math.min(g,xs[i+1]-xs[i]);return Math.max(g,2);});
  const grid=[1,0.5,0,-0.5,-1].map(f=>{const y=mid-f*halfH*0.94;return `<line x1="${PL}" x2="${W-PR}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${OD.line}" stroke-width="${f===0?0.9:0.4}" opacity="${f===0?0.9:0.5}"/><text x="${(PL-6)}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="8.5" fill="${f>0?OD.pos:f<0?OD.neg:OD.dim}" font-family="'JetBrains Mono',monospace">${f>0?'+':''}${odK(f*maxV)}</text>`;}).join('');
  const bars=vis.map((s,i)=>{
    const bw=Math.max(Math.min(gap[i]*0.62,5),1),x=(xs[i]-bw/2).toFixed(1);
    const hu=Math.abs(ups[i])/maxV*halfH*0.94,hd=Math.abs(dns[i])/maxV*halfH*0.94;
    let r='';
    if(hu>0.4)r+=`<rect x="${x}" y="${(mid-hu).toFixed(1)}" width="${bw.toFixed(1)}" height="${hu.toFixed(1)}" fill="${OD.pos}"/>`;
    if(hd>0.4)r+=`<rect x="${x}" y="${mid.toFixed(1)}" width="${bw.toFixed(1)}" height="${hd.toFixed(1)}" fill="${OD.neg}"/>`;
    const hw=Math.max(gap[i],4);
    return `<g onmousemove="optTip(event,&quot;${fnTip(s,i)}&quot;)" onmouseleave="optTipHide()"><rect x="${(xs[i]-hw/2).toFixed(1)}" y="${PT}" width="${hw.toFixed(1)}" height="${(H-PT-PB).toFixed(1)}" fill="transparent"/>${r}</g>`;
  }).join('');
  const spx=xC(Math.max(loK,Math.min(hiK,spot))),lblLeft=spx>W*0.72;
  const spotL=`<line x1="${spx.toFixed(1)}" x2="${spx.toFixed(1)}" y1="${(PT-6)}" y2="${(H-PB)}" stroke="#5cc8ff" stroke-width="1.1" stroke-dasharray="4 3" opacity="0.9"/><text x="${(spx+(lblLeft?-5:5)).toFixed(1)}" y="${(PT-1)}" text-anchor="${lblLeft?'end':'start'}" font-size="9" font-weight="700" fill="#5cc8ff" font-family="'JetBrains Mono',monospace">Spot ${(spot/1000).toFixed(2)}K</text>`;
  // X ekseni: yuvarlak K seviyeleri GERÇEK fiyat konumunda (etiket=bar)
  const cand=[500,1000,2000,2500,5000,10000,20000,25000,50000,100000];
  const step=cand.find(c=>rng/c<=11)||Math.max(1000,Math.ceil(rng/10/1000)*1000);
  let xlab='';
  for(let k=Math.ceil(loK/step)*step;k<=hiK;k+=step){const x=xC(k);xlab+=`<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${(H-PB)}" y2="${(H-PB+3)}" stroke="${OD.mute}" stroke-width="0.6"/><text x="${x.toFixed(1)}" y="${(H-8)}" text-anchor="middle" font-size="8" fill="${OD.mute}" font-family="'JetBrains Mono',monospace">${(k/1000).toFixed(k%1000?1:0)}K</text>`;}
  const bl=`<text x="${(W-PR)}" y="${(PT-8)}" text-anchor="end" font-size="8.5" fill="${OD.dim}" font-family="'JetBrains Mono',monospace">${birim||''}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;cursor:crosshair">${grid}${bars}${spotL}${xlab}${bl}</svg>${notu||''}`;
}

function odLadder(t,lv,spot){
  const all=(t.strikes||[]);
  if(!all.length||!spot)return '<div class="od-empty">Opsiyon verisi yükleniyor…</div>';
  const lo=spot*0.72,hi=spot*1.42;
  const vis=all.filter(s=>s.strike>=lo&&s.strike<=hi).slice().sort((a,b)=>a.strike-b.strike);
  if(!vis.length)return '<div class="od-empty">Bu vade için strike yok.</div>';
  const tip=s=>`<b>$${fmtNum(s.strike)}</b><br>Call OI: <b style='color:${OD.pos}'>${fmtNum(s.callOI||0)}</b><br>Put OI: <b style='color:${OD.neg}'>${fmtNum(s.putOI||0)}</b><br>Net γ ${(s.netGamma>=0?'+':'')+odK(s.netGamma||0)} · Δ ${((s.strike-spot)/spot*100).toFixed(1)}%`;
  const not=`<div class="od-note" style="margin-top:8px;line-height:1.5;font-size:11.5px"><b style="color:${OD.pos}">Yeşil ↑</b> Call OI · <b style="color:${OD.neg}">kırmızı ↓</b> Put OI · <span style="color:#5cc8ff">kesikli mavi</span>=spot. Sol eksen = OI büyüklüğü. Fare ile bara gel: Call/Put OI + Net γ + Δ%.</div>`;
  return odDikeyBar(vis,spot,s=>s.callOI||0,s=>s.putOI||0,tip,'açık pozisyon (kontrat)',not);
}

// ── Kilit Seviyeler ──
function odLevels(lv,spot){
  const rows=[['Call Wall','maks. pozitif γ',lv.call_wall,OD.pos],['Beklenen Hareket ↑','1σ hafta sonu',lv.em_ust,OD.neu],['Max Pain','min. yazar ödemesi',lv.max_pain,OD.acc],['Zero Gamma','rejim dönüşümü',lv.zero_gamma,OD.dim],['Beklenen Hareket ↓','1σ hafta sonu',lv.em_alt,OD.neu],['Put Wall','maks. negatif γ',lv.put_wall,OD.neg]].filter(r=>r[2]!=null);
  if(!rows.length)return '<div class="od-empty">yükleniyor…</div>';
  return '<div class="od-sheet-label">Kilit Seviyeler</div>'+rows.map(r=>{
    const n=r[0],sub=r[1],v=r[2],c=r[3];const pct=spot?((v-spot)/spot*100):null;
    return `<div class="od-lvl"><span class="od-dot" style="color:${c}"></span><span><span class="od-lname">${n}</span><span class="od-lsub">${sub}</span></span><span class="od-lval">$${fmtNum(v)}</span><span class="od-ldelta ${pct!=null&&pct>=0?'pos':'neg'}">${pct!=null?(pct>=0?'+':'')+pct.toFixed(2)+'%':'—'}</span></div>`;
  }).join('')+`<div class="od-note" style="margin-top:14px;line-height:1.6;font-size:12px"><b style="color:${OD.mute}">Hull, <i>Options, Futures &amp; Other Derivatives</i> (Böl. 19 — Greekler &amp; dinamik hedge) çerçevesi:</b> Piyasa yapıcılar net opsiyon pozisyonunu delta-nötr tutmak için spot/futures alıp satar; bu hedge akışı seviyeleri "mıknatıs" haline getirir. <b style="color:${OD.pos}">Call Wall</b> en yoğun pozitif gamma strike'ı; spot yükseldikçe dealer delta-hedge için satar → güçlü direnç. <b style="color:${OD.neg}">Put Wall</b> yoğun put gamma/OI destek bölgesi. <b style="color:${OD.dim}">Zero Gamma</b> net dealer gamma'nın işaret değiştirdiği eşik — üstünde long-gamma rejimi volatiliteyi bastırır (mean-reversion), altında short-gamma rejimi hareketi hızlandırır (momentum/breakout). <b style="color:${OD.acc}">Max Pain</b> en çok opsiyonun değersiz bittiği denge fiyatı; vade (özellikle haftalık expiry) yaklaştıkça theta+charm akışı fiyatı buraya çeker (pin etkisi). <b style="color:${OD.neu}">Beklenen Hareket</b> = ATM IV'den türetilen ±1σ haftalık bant (Hull §15 — log-normal fiyat dağılımı).</div>`;
}

// ── ii. KUANTUM DUVARLAR (dikey GEX barları) ──
function odWalls(t,lv,spot,g){
  const all=(t.strikes||[]).filter(s=>(s.callGex||0)!==0||(s.putGex||0)!==0);
  if(!all.length||!spot)return '<div class="od-empty">GEX verisi yükleniyor…</div>';
  const lo=spot*0.68,hi=spot*1.5;
  const vis=all.filter(s=>s.strike>=lo&&s.strike<=hi).slice().sort((a,b)=>a.strike-b.strike);
  if(!vis.length)return '<div class="od-empty">Bu aralıkta GEX yok.</div>';
  const netOf=s=>(s.netGamma!=null?s.netGamma:(s.callGex||0)+(s.putGex||0));
  const tip=s=>{const ng=netOf(s);return `<b>$${fmtNum(s.strike)}</b><br>Call γ: <b style='color:${OD.pos}'>+${odK(s.callGex||0)}</b><br>Put γ: <b style='color:${OD.neg}'>${odK(s.putGex||0)}</b><br>Net γ ${ng>=0?'+':''}${odK(ng)} · OI ${fmtNum((s.callOI||0)+(s.putOI||0))}`;};
  const not=`<div class="od-note" style="margin-top:8px;line-height:1.5;font-size:11.5px"><b style="color:${OD.pos}">Yeşil ↑</b> Call γ (call duvar → direnç/mıknatıs) · <b style="color:${OD.neg}">kırmızı ↓</b> Put γ (put duvar → destek). <span style="color:#5cc8ff">kesikli mavi</span>=spot. Sol eksen = USD GEX/%1. Fare ile bara gel: call/put/net γ + OI. [Hull §19]</div>`;
  return odDikeyBar(vis,spot,s=>s.callGex||0,s=>-(s.putGex||0),tip,'USD GEX / %1 hareket',not);
}

// ── iii. CVD çizgisi (medyan + spot overlay + saatlik tooltip + hacim) ──
function odLine(d,renk,birim,opt){
  opt=opt||{};
  if(!d||!d.seri||!d.seri.length)return '<div class="od-empty">Veri yükleniyor…</div>';
  const S=d.seri;
  const vals=S.map(x=>Number(x.v)).filter(v=>isFinite(v));
  if(vals.length<2)return '<div class="od-empty">Yeterli veri yok</div>';
  const hasVol=!!(d.hacim&&d.hacim.length);
  const W=1000,PL=64,PR=opt.spot?54:16,PT=12,LH=118,G=12,VOLH=34,PB=14;
  const H=hasVol?(PT+LH+G+VOLH+PB):(PT+LH+PB);
  const iw=W-PL-PR,ih=LH,n=S.length;
  const med=isFinite(d.medyan)?Number(d.medyan):vals[vals.length-1];
  let mn=Math.min(...vals,med),mx=Math.max(...vals,med);if(mx===mn){mx+=1;mn-=1;}
  const pad=(mx-mn)*0.08;mn-=pad;mx+=pad;
  const X=i=>PL+(n<=1?iw/2:(i/(n-1))*iw);
  const Y=v=>PT+(1-(v-mn)/(mx-mn))*ih;
  const path=vals.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const medY=Y(med).toFixed(1);
  const fY=v=>birim==='$'?('$'+odK(v)):odK(v);
  const last=vals[vals.length-1];
  const grid=[mx,(mx+mn)/2,mn].map(v=>`<line x1="${PL}" x2="${W-PR}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="${OD.line}" stroke-width="1"/><text x="${PL-8}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="9" fill="${OD.mute}">${fY(v)}</text>`).join('');
  // spot overlay (sağ eksen, turuncu) — Image 2 gibi
  let spotSvg='';
  if(opt.spot){
    const sp=S.map(x=>x.spot==null?null:Number(x.spot)),sv=sp.filter(v=>v!=null&&isFinite(v));
    if(sv.length>1){
      let smn=Math.min(...sv),smx=Math.max(...sv);if(smx===smn){smx+=1;smn-=1;}
      const spad=(smx-smn)*0.12;smn-=spad;smx+=spad;
      const SY=v=>PT+(1-(v-smn)/(smx-smn))*ih;
      let sd='',started=false;
      sp.forEach((v,i)=>{if(v==null)return;sd+=(started?'L':'M')+X(i).toFixed(1)+','+SY(v).toFixed(1)+' ';started=true;});
      const rg=[smx,(smx+smn)/2,smn].map(v=>`<text x="${W-PR+6}" y="${(SY(v)+3).toFixed(1)}" text-anchor="start" font-family="'JetBrains Mono',monospace" font-size="9" fill="${OD.sell}" opacity="0.85">${odK(v)}</text>`).join('');
      spotSvg=`<path d="${sd.trim()}" fill="none" stroke="${OD.sell}" stroke-width="1.6" stroke-linejoin="round" opacity="0.9"/>${rg}`;
    }
  }
  // hacim (kova bazlı alım/satım, çizgiyle hizalı)
  let vol='';
  if(hasVol){
    const hb=d.hacim,vb=PT+LH+G+VOLH;
    const maxV=Math.max(...hb.map(h=>(h.buy||0)+(h.sell||0)),1);
    const bwv=Math.max(iw/hb.length*0.7,1);
    vol=`<text x="${PL-8}" y="${(PT+LH+G+9).toFixed(1)}" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="8" fill="${OD.mute}">HACİM</text>`+
      hb.map((h,i)=>{const x=PL+(n<=1?iw/2:(i/(n-1))*iw),tot=(h.buy||0)+(h.sell||0),hh=Math.max(tot/maxV*VOLH,0.6),net=(h.buy||0)-(h.sell||0),col=net>=0?OD.pos:OD.neg;
        return `<rect x="${(x-bwv/2).toFixed(1)}" y="${(vb-hh).toFixed(1)}" width="${bwv.toFixed(1)}" height="${hh.toFixed(1)}" fill="${col}" opacity="0.5"/>`;}).join('');
  }
  // saatlik hover sütunları → tooltip (Image 2'deki kutu)
  const colW=iw/Math.max(n,1),hovH=hasVol?(LH+G+VOLH):ih;
  const hov=S.map((p,i)=>{const x=X(i),dt=new Date(p.ts),hh=String(dt.getHours()).padStart(2,'0'),dd=String(dt.getDate()).padStart(2,'0'),mo=String(dt.getMonth()+1).padStart(2,'0');
    let tip;
    if(opt.detay){tip=`${dd}.${mo} ${hh}:00<br>Call Buy (+): <b style='color:${OD.pos}'>${fmtNum(p.cb||0)}</b><br>Call Sell (−): <b style='color:${OD.neg}'>${fmtNum(p.cs||0)}</b><br>Put Buy (−): <b style='color:${OD.neg}'>${fmtNum(p.pb||0)}</b><br>Put Sell (+): <b style='color:${OD.pos}'>${fmtNum(p.ps||0)}</b><br>Saat Δ: <b style='color:${(p.delta||0)>=0?OD.pos:OD.neg}'>${(p.delta||0)>=0?'+':''}${fmtNum(p.delta||0)}</b> · CVD: <b style='color:${OD.text}'>${fY(p.v)}</b>`;}
    else{tip=`${dd}.${mo} ${hh}:00<br>${birim==='$'?'Premium':'CVD'}: <b style='color:${renk}'>${fY(p.v)}</b>`;}
    return `<rect x="${(x-colW/2).toFixed(1)}" y="${PT}" width="${colW.toFixed(1)}" height="${hovH.toFixed(1)}" fill="transparent" onmousemove="optTip(event,&quot;${tip}&quot;)" onmouseleave="optTipHide()"/>`;}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;cursor:crosshair">${grid}<line x1="${PL}" x2="${W-PR}" y1="${medY}" y2="${medY}" stroke="${OD.text}" stroke-width="1" stroke-dasharray="6 4" opacity="0.55"/><text x="${W-PR}" y="${(medY-5)}" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="${OD.text}" opacity="0.7">MEDYAN ${fY(med)}</text>${spotSvg}<path d="${path}" fill="none" stroke="${renk}" stroke-width="2" stroke-linejoin="round"/><circle cx="${X(vals.length-1).toFixed(1)}" cy="${Y(last).toFixed(1)}" r="4" fill="${renk}"/>${vol}${hov}</svg>`;
}
function odCvd(d,baslik,birim,aciklama,opt){
  const yon=d&&d.yon,renk=yon==='YUKARI'?OD.pos:yon==='AŞAĞI'?OD.neg:OD.neu;
  const fmtV=v=>birim==='$'?('$'+fmtNum(v)):fmtNum(v);
  const dv=d&&d.divergence;
  const dvBadge=dv?`<span class="od-pill" style="background:${dv.tip==='BULLISH'?OD.pos:OD.neg}">⚠ ${dv.tip} DIVERGENCE</span>`:'';
  const head=`<div class="od-cvd-h"><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><span class="od-cvd-t">${baslik}</span>${d&&d.yon?`<span class="od-pill" style="background:${renk}">${yon==='YUKARI'?'▲ YUKARI':yon==='AŞAĞI'?'▼ AŞAĞI':'— NÖTR'}</span>`:''}${dvBadge}</div>${d&&d.guncel!=null?`<div style="font-size:10px;color:${OD.mute}">Net: <b style="color:${renk};font-size:12px">${fmtV(d.guncel)}</b> · Medyan: <b style="color:${OD.text}">${fmtV(d.medyan)}</b></div>`:''}</div>`;
  return `<div style="margin-bottom:18px">${head}${odLine(d,renk,birim,opt)}<div class="od-note">${aciklama}</div></div>`;

// ── Gamma / Buy-Sell per strike (histogram) ──
function odGammaStrike(arr,spot){
  if(!arr||!arr.length)return '<div class="od-empty">Veri yükleniyor…</div>';
  const W=1000,H=240,PT=20,PR=28,PB=40,PL=52,cW=W-PL-PR,cH=H-PT-PB;
  const lo=Math.min(...arr.map(d=>d.strike)),hi=Math.max(...arr.map(d=>d.strike)),span=(hi-lo)||1;
  const X=s=>PL+((s-lo)/span)*cW;
  const yMax=Math.max(...arr.map(d=>Math.abs(d.net)),1e-6)*1.1,zY=PT+cH/2;
  const bw=Math.max(cW/arr.length*0.55,1);
  const bars=arr.map(d=>{const x=X(d.strike),h=Math.abs(d.net)/yMax*(cH/2);if(h<0.4)return '';const pos=d.net>=0;
    const tip=`$${fmtNum(d.strike)}<br>Net Γ: <b style='color:${pos?OD.pos:OD.neg}'>${d.net>=0?'+':''}${d.net}M</b>`;
    return `<rect x="${(x-bw/2).toFixed(1)}" y="${(pos?zY-h:zY).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${pos?OD.pos:OD.neg}" opacity="0.88" onmousemove="optTip(event,&quot;${tip}&quot;)" onmouseleave="optTipHide()"/>`;}).join('');
  let xt='';for(let p=Math.ceil(lo/8000)*8000;p<=hi;p+=8000){const x=X(p);xt+=`<text x="${x.toFixed(1)}" y="${H-PB+18}" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="10" fill="${OD.mute}">${(p/1000).toFixed(0)}K</text>`;}
  const ymax=yMax/1.1;
  const yl=[[PT,'+'+odK(ymax*1e6)],[zY,'0'],[H-PB,'−'+odK(ymax*1e6)]].map(([y,t])=>`<text x="${PL-6}" y="${(y+3).toFixed(1)}" text-anchor="end" font-family="JetBrains Mono,monospace" font-size="9" font-weight="700" fill="${OD.mute}">${t}</text>`).join('');
  let sp='';if(spot){const x=X(spot);sp=`<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${PT}" y2="${H-PB}" stroke="${OD.acc}" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/><text x="${x.toFixed(1)}" y="${PT-4}" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9" font-weight="600" fill="${OD.acc}">SPOT ${(spot/1000).toFixed(1)}K</text>`;}
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;cursor:crosshair"><line x1="${PL}" x2="${W-PR}" y1="${zY}" y2="${zY}" stroke="${OD.lineH}" stroke-width="1"/>${bars}${sp}${xt}${yl}</svg><div class="od-note" style="line-height:1.5">Y ekseni = seviye başına net dealer Γ ($ / %1 hareket); ↑ pozitif (fiyat sabitleyici) · ↓ negatif (ivme). Fare ile çubuğa gel: strike·net Γ.</div>`;
}
function odBuySell(arr,spot){

  const X=s=>PL+((s-lo)/span)*cW;
  const yMax=Math.max(...arr.map(d=>Math.max(d.buy||0,d.sell||0)),1)*1.1,zY=PT+cH/2;

  let xt='';for(let p=Math.ceil(lo/8000)*8000;p<=hi;p+=8000){const x=X(p);xt+=`<text x="${x.toFixed(1)}" y="${H-PB+18}" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="10" fill="${OD.mute}">${(p/1000).toFixed(0)}K</text>`;}
  const ymax=yMax/1.1;

  let sp='';if(spot){const x=X(spot);sp=`<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${PT}" y2="${H-PB}" stroke="${OD.acc}" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/><text x="${x.toFixed(1)}" y="${PT-4}" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9" font-weight="600" fill="${OD.acc}">SPOT ${(spot/1000).toFixed(1)}K</text>`;}
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;cursor:crosshair"><line x1="${PL}" x2="${W-PR}" y1="${zY}" y2="${zY}" stroke="${OD.lineH}" stroke-width="1"/>${bars}${sp}${xt}${yl}</svg><div style="display:flex;gap:16px;margin-top:6px;font-size:9px;color:${OD.dim}"><span style="color:${OD.buy}">▲ Buy (üst · kontrat)</span><span style="color:${OD.sell}">▼ Sell (alt · kontrat)</span></div>`;
}

// ── iv. Toplu Greek'ler ──
function odGreeks(g){
  const cells=[
    ['Δ','Net Delta',g.net_delta,g.delta_yorum,'M$'],
    ['Γ','Net Gamma',g.net_gamma,g.gamma_yorum,'M$/1%'],
    ['Θ','Net Theta',g.net_theta,g.theta_yorum,'M$/gün'],

    ['ρ','Net Rho',g.net_rho,g.rho_yorum,'M$/1%'],
  ];
  const grid='<div class="od-greeks">'+cells.map(c=>{const sym=c[0],lab=c[1],v=c[2],foot=c[3],unit=c[4];
    const val=v==null?'—':((v>=0?'+':'')+v);const col=v==null?OD.text:v<0?OD.neg:v>0?OD.pos:OD.text;
    return `<div class="od-greek"><div class="od-glyph">${sym}</div><div class="od-glabel">${lab}</div><div class="od-gnum" style="color:${col}">${val}${v!=null?'<span style="color:'+OD.dim+';font-size:14px"> '+unit+'</span>':''}</div><div class="od-gfoot">${esc(foot||'')}</div></div>`;
  }).join('')+'</div>';
  // Tüm Yunan harfleri birleşince → toplu (aggregated) yorum
  const birlesik=g.birlesik_yorum?`<div class="od-greek-agg">⚹ Birleşik Greek Okuması: ${esc(g.birlesik_yorum)}</div>`:'';
  return grid+birlesik;
}

// ── v. Volatilite Yüzeyi ──
function odTerm(arr){
  const src=(arr||[]).filter(x=>{const v=Number(x.iv);return isFinite(v)&&v>1&&v<300;});
  if(src.length<2)return '<div class="od-empty">Hesaplanıyor…</div>';
  const pts=src.map(x=>Number(x.iv));
  const W=620,H=220,PL=46,PR=24,PT=24,PB=34,iw=W-PL-PR,ih=H-PT-PB;
  let mn=Math.min(...pts),mx=Math.max(...pts);const r=(mx-mn)||5;mn-=r*0.15;mx+=r*0.15;
  const X=i=>PL+(i/(pts.length-1))*iw,Y=v=>PT+(1-(v-mn)/(mx-mn))*ih;
  const path=pts.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const fill=path+` L ${X(pts.length-1).toFixed(1)} ${H-PB} L ${X(0).toFixed(1)} ${H-PB} Z`;
  const grid=[mx,(mx+mn)/2,mn].map(v=>`<line x1="${PL}" x2="${W-PR}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="${OD.lineS}" stroke-width="0.6"/><text x="${PL-5}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="9" font-weight="700" fill="${OD.mute}">${v.toFixed(0)}%</text>`).join('');
  const dots=src.map((o,i)=>{const v=Number(o.iv);const tip=`Vade: <b>${o.gun??'—'}g</b> · ATM IV <b style='color:${OD.acc}'>${v.toFixed(1)}%</b>`;
    return `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="4" fill="${OD.bg}" stroke="${OD.acc}" stroke-width="1.5" style="cursor:crosshair" onmousemove="optTip(event,&quot;${tip}&quot;)" onmouseleave="optTipHide()"/><text x="${X(i).toFixed(1)}" y="${(Y(v)-9).toFixed(1)}" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" font-weight="700" fill="${OD.t2}">${v.toFixed(0)}</text>`;}).join('');
  const xl=src.map((o,i)=>`<text x="${X(i).toFixed(1)}" y="${H-PB+16}" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="${OD.mute}">${o.gun!=null?o.gun+'g':''}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;cursor:crosshair"><defs><linearGradient id="odiv" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="${OD.acc}" stop-opacity="0.18"/><stop offset="100%" stop-color="${OD.acc}" stop-opacity="0.01"/></linearGradient></defs>${grid}<path d="${fill}" fill="url(#odiv)"/><path d="${path}" fill="none" stroke="${OD.acc}" stroke-width="2"/>${dots}${xl}</svg>`;
}
function odRR(arr){
  const src=(arr||[]).filter(x=>isFinite(Number(x.rr))).slice(0,14);
  if(!src.length)return '<div class="od-empty">Hesaplanıyor…</div>';
  const rows=src.map(x=>Number(x.rr));
  const W=620,H=220,PL=52,PR=24,PT=24,PB=34,cW=W-PL-PR,cH=H-PT-PB;
  const mx=Math.max(...rows,1)+1,mn=Math.min(...rows,-1)-1,rng=mx-mn;
  const X=i=>PL+(i+0.5)*(cW/rows.length),Y=v=>PT+((mx-v)/rng)*cH,y0=Y(0);
  const bw=Math.max(8,Math.min(36,cW/rows.length*0.6));
  const bars=src.map((o,i)=>{const v=Number(o.rr),x=X(i),top=v>=0?Y(v):y0,h=Math.max(Math.abs(Y(v)-y0),2),renk=v>=0?OD.neg:OD.pos;
    const tip=`Vade: <b>${o.gun??'—'}g</b> · RR <b style='color:${renk}'>${v>=0?'+':''}${v.toFixed(2)}</b>`+(o.put_iv!=null?`<br>Put IV ${o.put_iv}% · Call IV ${o.call_iv}%`:'');
    return `<g style="cursor:crosshair" onmousemove="optTip(event,&quot;${tip}&quot;)" onmouseleave="optTipHide()"><rect x="${(x-bw/2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${renk}" opacity="0.62" rx="1"/><line x1="${(x-bw/2).toFixed(1)}" x2="${(x+bw/2).toFixed(1)}" y1="${top.toFixed(1)}" y2="${top.toFixed(1)}" stroke="${renk}" stroke-width="1.5"/><text x="${x.toFixed(1)}" y="${(v>=0?top-5:top+h+12).toFixed(1)}" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" font-weight="700" fill="${OD.t2}">${v>=0?'+':''}${v.toFixed(1)}</text></g>`;}).join('');
  const xl=src.map((o,i)=>`<text x="${X(i).toFixed(1)}" y="${H-PB+16}" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="${OD.mute}">${o.gun!=null?o.gun+'g':''}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;cursor:crosshair"><line x1="${PL}" x2="${W-PR}" y1="${y0.toFixed(1)}" y2="${y0.toFixed(1)}" stroke="${OD.lineH}" stroke-width="1.2"/><text x="${PL-5}" y="${(y0+3).toFixed(1)}" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="9" font-weight="700" fill="${OD.dim}">0</text>${bars}${xl}</svg>`;
}

// ── vi. Pozisyon · Analiz ──
function odPozisyon(lv,spot,g,oy){
  const cw=lv.call_wall||0,pw=lv.put_wall||0,band=cw-pw;
  const bandPct=spot?((band/spot)*100).toFixed(1):'—';
  const pull=(cw&&pw)?`Put Wall–Call Wall bandı <em>$${fmtNum(band)}</em> (${bandPct}%) gerçekleşen volatiliteyi sınırlar.`:'Seviye verisi bekleniyor.';
  return `<div style="border:1px solid ${OD.line};border-radius:8px;background:${OD.surf};padding:14px 16px"><p class="od-pull" style="margin:0 0 10px">${pull}</p><p style="font-size:12px;color:${OD.t2};line-height:1.7;margin:0">${esc((oy&&oy.yorum)||'')||'Opsiyon pozisyon analizi yükleniyor…'}</p></div>`;
}

function odGexHeatmap(d){
  if(!d||!d.satirlar||!d.vadeler) return '<div class="od-note">Isı haritası yükleniyor…</div>';
  if(!d.satirlar.length) return '<div class="od-note">Veri yok.</div>';
  const V=d.vadeler, S=d.satirlar, spot=d.spot, maxa=d.maxabs||1;
  const cell=(v)=>{
    if(v==null) return `<td style="padding:3px 6px;border-bottom:1px solid ${OD.line}"></td>`;
    const a=Math.min(1,Math.abs(v)/maxa), col=v>=0?'31,240,173':'255,93,108';
    const alpha=(0.06+a*0.60).toFixed(2);
    return `<td style="padding:3px 6px;text-align:right;border-bottom:1px solid ${OD.line};background:rgba(${col},${alpha});color:${v>=0?OD.pos:OD.neg};font-weight:600">${v>=0?'+':'−'}${odK(Math.abs(v))}</td>`;
  };
  const head=`<th style="text-align:left;padding:4px 6px;color:${OD.dim};font-size:9px;font-weight:600">STRİKE</th>`+
    V.map(x=>`<th style="text-align:right;padding:4px 6px;color:${OD.dim};font-size:9px;font-weight:600">${x.label}</th>`).join('');
  let spotDone=false, rows='';
  for(const r of S){
    if(spot!=null && !spotDone && r.strike<spot){
      rows+=`<tr><td colspan="${V.length+1}" style="padding:1px 0;border-top:1px dashed ${OD.acc}"><span style="font-size:9px;color:${OD.acc};padding-left:6px">spot ${fmtNum(Math.round(spot))}</span></td></tr>`;
      spotDone=true;
    }
    rows+=`<tr><td style="padding:3px 6px;color:${OD.t2};font-family:'JetBrains Mono',monospace;font-size:10px;border-bottom:1px solid ${OD.line}">${fmtNum(r.strike)}</td>${r.hucreler.map(cell).join('')}</tr>`;
  }
  const kaynak=d.kaynaklar?Object.entries(d.kaynaklar).map(([k,v])=>k+' '+v).join(' · '):'';
  // Δ modu notu
  const modNot=(d.mod&&d.mod!=='kapali')?(d.delta_yok
    ?`<div class="od-note" style="margin-bottom:8px;color:${OD.neu}">Δ ${d.mod==='anlik'?'ANLIK':'GÜN-İÇİ'}: yeterli geçmiş yok — birkaç dakika içinde birikecek; şimdilik mutlak değerler.</div>`
    :`<div class="od-note" style="margin-bottom:8px;color:${OD.dim}">Δ ${d.mod==='anlik'?'ANLIK (~22dk önceye göre)':'GÜN-İÇİ (açılışa göre)'} pozisyon değişimi — yeşil birikiyor, kırmızı çözülüyor.</div>`):'';
  return modNot+`<div style="overflow-x:auto;max-height:520px"><table style="width:100%;border-collapse:collapse;font-size:10px"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`+
    `<div class="od-note" style="margin-top:10px;line-height:1.5;font-size:11.5px">Hücre = o strike+vadedeki net dealer GEX (${esc(d.birim||'')}); spot %1 oynarsa dealer'ın delta'sı ~bu kadar USD kayar. <b style="color:${OD.pos}">Yeşil</b> long-gamma (pinler) · <b style="color:${OD.neg}">Kırmızı</b> short-gamma (hızlandırır). ${kaynak?`<span style="color:${OD.mute}">${kaynak}</span>`:''}</div>`;
}

// ── Üst KİLİT SEVİYELER (minimal birleşik tablo — tepede, tekrar edilmez) ──
function odKilitUst(lv,spot,g){
  const items=[['Call Wall',lv.call_wall],['Bek. Hareket ↑',lv.em_ust],['Max Pain',lv.max_pain],['Zero Gamma',lv.zero_gamma],['Bek. Hareket ↓',lv.em_alt],['Put Wall',lv.put_wall]].filter(x=>x[1]!=null);
  if(!items.length)return '';
  const cell=(n,v)=>{const pct=spot?((v-spot)/spot*100):null;const col=spot?(v>=spot?OD.pos:OD.neg):OD.t2;
    return `<div style="flex:1;min-width:104px;padding:8px 12px;border-right:1px solid ${OD.line}"><div style="font-size:8px;letter-spacing:.08em;color:${OD.mute};margin-bottom:3px">${n.toUpperCase()}</div><div style="font-size:15px;font-weight:700;color:${col};font-family:'JetBrains Mono',monospace">${fmtNum(v)}</div><div style="font-size:9px;color:${pct>=0?OD.pos:OD.neg}">${pct!=null?(pct>=0?'+':'')+pct.toFixed(2)+'%':''}</div></div>`;};
  const ng=g&&g.net_gamma;
  const ngCell=`<div style="flex:1;min-width:104px;padding:8px 12px"><div style="font-size:8px;letter-spacing:.08em;color:${OD.mute};margin-bottom:3px">NET GEX · SPOT</div><div style="font-size:15px;font-weight:700;color:${ng>=0?OD.pos:OD.neg};font-family:'JetBrains Mono',monospace">${ng!=null?(ng>=0?'+':'')+ng+'M':'—'}</div><div style="font-size:9px;color:${OD.acc}">spot ${spot?fmtNum(Math.round(spot)):'—'}</div></div>`;
  return `<div style="display:flex;flex-wrap:wrap;border:1px solid ${OD.line};border-radius:8px;background:${OD.surf};margin-bottom:12px">${items.map(x=>cell(x[0],x[1])).join('')}${ngCell}</div>`;
}
// ── HULL SENTEZİ — tüm sayfa verisinin birleşik bilimsel yorumu ──
function odHullYorumu(lv,spot,g,sk){
  const ng=g&&g.net_gamma,zg=lv.zero_gamma,cw=lv.call_wall,pw=lv.put_wall,mp=lv.max_pain;
  const rr=(sk&&sk.risk_reversal&&sk.risk_reversal[0])?sk.risk_reversal[0].rr:null;
  const S=[];
  if(ng!=null)S.push(`<b style="color:${ng>=0?OD.pos:OD.neg}">${ng>=0?'Pozitif':'Negatif'} net gamma</b> (${(ng>=0?'+':'')+ng}M) → dealer ${ng>=0?'<b>long-gamma</b>: hedge akışı volatiliteyi bastırır, spot duvara yaklaşınca sıkışır (mean-reversion)':'<b>short-gamma</b>: hedge trendle aynı yönde, hareket hızlanır (momentum/breakout)'} <span style="color:${OD.mute}">[Hull Böl.19]</span>.`);
  if(spot&&zg)S.push(`Spot ${fmtNum(Math.round(spot))}, zero-gamma <b>${fmtNum(zg)}</b>'in ${spot>=zg?'ÜSTÜNDE → long-gamma bölge (bastırma)':'ALTINDA → short-gamma bölge (ivmelenme)'}.`);
  if(cw&&pw&&spot)S.push(`Hedge bandı <b>${fmtNum(pw)}–${fmtNum(cw)}</b> (${((cw-pw)/spot*100).toFixed(1)}%): Put Wall destek, Call Wall direnç.`);
  if(mp&&spot)S.push(`Max-Pain <b style="color:${OD.acc}">${fmtNum(mp)}</b> (${((mp-spot)/spot*100).toFixed(1)}%): vadede theta+charm akışı fiyatı buraya çeker (pin) <span style="color:${OD.mute}">[Hull §19]</span>.`);
  if(rr!=null)S.push(`25Δ RR <b style="color:${rr>=0?OD.neg:OD.pos}">${rr>=0?'+':''}${rr.toFixed(1)}</b> → ${rr>=0?'put skew: aşağı korunma talebi baskın':'call skew: yukarı spekülasyon talebi'} <span style="color:${OD.mute}">[Hull §20.3]</span>.`);
  if(!S.length)return '';
  return `<div style="border:1px solid ${OD.line};border-radius:8px;background:${OD.surf};padding:13px 16px;margin-bottom:16px"><div class="od-sheet-label" style="margin-bottom:8px">Hull Sentezi · tüm sayfanın birleşik okuması</div><div style="font-size:12px;color:${OD.t2};line-height:1.75">${S.join(' ')}</div></div>`;
}

function scrMacro(){

  const oz=ST.makroOzet||{};

let _chatFile=null;
function chatDosyaSecildi(el){
  const f=el.files&&el.files[0];if(!f)return;
  _chatFile=f;
  const ad=$('chat-eklenti-ad');if(ad)ad.textContent='📎 '+f.name+' ('+(f.size/1024).toFixed(0)+' KB)';
  const box=$('chat-eklenti');if(box)box.style.display='flex';
  const ogr=$('chat-ogret-satir');if(ogr)ogr.style.display='block';
  const inp=$('chatin');if(inp&&!inp.value)inp.value='Bu dosyayı analiz et';
}
function chatDosyaTemizle(){
  _chatFile=null;
  const box=$('chat-eklenti');if(box)box.style.display='none';
  const ogr=$('chat-ogret-satir');if(ogr)ogr.style.display='none';
  const fi=$('chatfile');if(fi)fi.value='';
}
async function dosyaOgret(){
  if(!_chatFile){alert('Önce dosya seç');return;}
  const f=_chatFile;
  ST.chat.push({role:'user',txt:'📚 Öğret: '+f.name});
  ST.chat.push({role:'agent',txt:'⏳ Bilgi tabanına ekleniyor...'});
  updateChatOnly();
  const fd=new FormData();fd.append('file',f);fd.append('category','strateji');
  try{
    const r=await fetch('/api/knowledge/document',{method:'POST',body:fd});
    const d=await r.json();
    ST.chat.pop();
    if(r.ok){
      const isImg=/\.(png|jpg|jpeg|gif|webp)$/i.test(f.name);
      let msg='✅ Öğrendim: **'+(d.title||f.name)+'**';
      if(isImg&&d.onizleme){msg+=' — Grafik analiz edildi:\n\n'+d.onizleme;}
      else{msg+=' ('+(d.chunks||'?')+' parça, '+(d.total_words||'?')+' kelime). Artık stratejini sorularında kullanacağım.';}
      ST.chat.push({role:'agent',txt:msg});
    }
    else{ST.chat.push({role:'agent',txt:'❌ '+((d&&d.detail)||'Yükleme başarısız')});}
  }catch(e){ST.chat.pop();ST.chat.push({role:'agent',txt:'❌ Hata: '+e});}
  chatDosyaTemizle();updateChatOnly();
}
async function send(){
  const inp=$('chatin');if(!inp)return;const q=inp.value.trim();
  if(_chatFile){
    const f=_chatFile;
    ST.chat.push({role:'user',txt:(q||'Bu dosyayı analiz et')+' 📎'+f.name});
    ST.chat.push({role:'agent',txt:'⏳ Dosya okunuyor...'});
    inp.value='';updateChatOnly();
    const fd=new FormData();fd.append('message',q||'Bu dosyayı analiz et');fd.append('file',f);
    try{
      const r=await fetch('/api/chat',{method:'POST',body:fd});
      const d=await r.json();
      ST.chat.pop();
      ST.chat.push({role:'agent',txt:(d&&(d.reply||d.cevap||d.response))||'Yanıt alınamadı'});
    }catch(e){ST.chat.pop();ST.chat.push({role:'agent',txt:'❌ Hata: '+e});}
    chatDosyaTemizle();updateChatOnly();return;
  }
  if(!q)return;inp.value='';
  ST.chat.push({role:'user',txt:q});
  ST.chat.push({role:'agent',txt:'⏳ Analiz ediliyor...'});
  updateChatOnly();  // tüm ekranı değil, sadece sohbeti güncelle
  const d=await jpost('/api/leader/chat',{soru:q});
  ST.chat.pop();  // typing mesajını çıkar
  ST.chat.push({role:'agent',txt:(d&&d.cevap)||'Yanıt alınamadı'});
  updateChatOnly();
}

async function loadContext(){const d=await jget('/api/market-context');if(d)ST.ctx=d;}
async function loadKarar(){const d=await jget('/api/leader/karar?sembol=BTCUSDT&ai=false');if(d&&!d.detail)ST.karar=d;}
async function loadPaper(){const d=await jget('/api/leader/paper-trades');if(d&&!d.detail)ST.paper=d;}

async function loadKomuta(){const d=await jget('/api/komuta-merkezi');if(d&&d.kutular)ST.komuta=d;}

async function loadGrafikYorum(){const[b,e]=await Promise.all([jget('/api/grafik-yorum?symbol=BTCUSDT'),jget('/api/grafik-yorum?symbol=ETHUSDT')]);ST.grafikYorum={BTCUSDT:b||{},ETHUSDT:e||{}};if(document.fullscreenElement){for(const s2 of ['BTCUSDT','ETHUSDT'])kFsYorumGuncelle(s2);}if(ST.tab==='leader')render();}
async function loadTheoryHipotez(){
  const d=await jget('/api/theory/hipotezler');if(d)ST.theoryHipotez=d;
  const y=await jget('/api/theory/yorum');if(y)ST.theoryYorum=y;

async function loadTheories(){return loadTheoryHipotez();}
async function loadOptions(){ return loadOptionsFull(); }
async function loadOptionsFull(){
  const v=_optVade, c=_optCur;
  const[topo,greek,skew,cvd,dag,yorum,vm,hm]=await Promise.all([
    jget('/api/options/topografya?currency='+c+'&vade='+v),
    jget('/api/options/greekler?currency='+c),
    jget('/api/options/skew?currency='+c),
    jget('/api/options/cvd-uclu?currency='+c),
    jget('/api/options/islem-dagilimi?currency='+c),
    jget('/api/opsiyon-yorum?currency='+c),
    jget('/api/options/vade-masasi?currency='+c),
    jget('/api/options/gex-heatmap?currency='+c+'&greek='+_optHeatGreek+'&mod='+_optHeatMod)
  ]);
  if(vm&&!vm.error)ST.optVadeMasasi=vm;
  if(hm&&!hm.error)ST.optHeatmap=hm;
  if(topo&&!topo.error)ST.optTopo=topo;
  if(greek&&!greek.error)ST.optGreek=greek;
  if(skew&&!skew.error)ST.optSkew=skew;
  if(cvd&&!cvd.error)ST.optCvd=cvd;
  if(dag&&!dag.error)ST.optDagilim=dag;
  if(yorum)ST.opsiyonYorum=yorum;
  if(ST.tab==='options')render();
}
async function loadKnowledge(){
  const d=await jget('/api/knowledge');if(d)ST.knowledge=d;
  const k=await jget('/api/knowledge/kitaplar');if(k)ST.kitapStat=k;
  if(!ST.devops)await loadDevops(false);

}

  const t=await jget('/api/oar-trend');if(t)ST.oarTrend=t;
  if(ST.tab==='leader')render();
}
async function loadBasariSkoru(){const d=await jget('/api/basari-skoru');if(d)ST.basariSkoru=d;}
async function loadMakro(force){const q=force?'?refresh=true':'';const d=await jget('/api/makro'+q);if(d)ST.makro=d;const o=await jget('/api/makro/ozet');if(o)ST.makroOzet=o;const cr=await jget('/api/makro/carry');if(cr)ST.makroCarry=cr;if(ST.tab==='macro')render();}
async function loadDevops(force){const d=await jget('/api/devops');if(d)ST.devops=d;if(force&&ST.tab==='knowledge')render();}
async function loadFeed(){
  const d=await jget('/api/leader/rapor-gecmisi?limit=10');
  if(d&&d.raporlar){
    const renk={lider:'#1ff0ad',backtest:'#ffb13c',research:'#56a8ff'};
    const ad={lider:'Lider Agent',backtest:'Backtest Agent',research:'Research Agent'};
    ST.feed=d.raporlar.slice().reverse().map(r=>({
      t:new Date(r.tarih).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}),
      a:ad[r.tip]||r.tip,col:renk[r.tip]||'#9fb0ad',
      txt:(r.icerik&&r.icerik.metin)||''
    }));
  }
}
async function loadFng(){
  const d=await jget('/api/market');
  // F&G ayrı endpoint yok, market-context'te korku endeksi olabilir; fallback
}

// ════════════ INIT ════════════
async function boot(){
  renderNav();render();
  tickClock();setInterval(tickClock,1000);
  // Non-blocking: her yükleyici bitince ANINDA yeniden çiz — yavaş AI
  // çağrıları (piyasa-durumu, grafik-yorum, karar) hızlıları bekletmesin.
  const _loaders=[loadOarSistem,loadSignals,loadReport,loadContext,loadTheories,loadFeed,loadIndicators,loadOptScore,loadOarFib,loadOpsiyonYorum,loadBasariSkoru,loadGrafikYorum,loadKarar,loadHipotez,loadBacktestOtonom,loadBacktestYerel,loadOarPaper,loadOarAltcoin];
  _loaders.forEach(fn=>{try{fn().then(()=>render()).catch(()=>{});}catch(e){}});
  loadTicker();loadOptions();
  // sayfa yenilendiğinde son sekmede kal → o sekmenin verisini de yükle
  if(ST.tab==='macro')loadMakro();
  setInterval(()=>{if(ST.tab==='leader'){kGrafikVeri('BTCUSDT',true);kGrafikVeri('ETHUSDT',true);}},30000);
  setInterval(async()=>{await loadSignals();await loadContext();await loadIndicators();await loadOptScore();await loadOarFib();
    if(ST.tab==='live'){updateFeedOnly();}
    else if(['leader','live'].includes(ST.tab))render();},120000);
  setInterval(async()=>{await loadOarSistem();await loadReport();await loadFeed();await loadOpsiyonYorum();await loadGrafikYorum();await loadKarar();await loadHipotez();await loadBacktestOtonom();await loadOarPaper();await loadOarAltcoin();
    if(ST.tab==='live'){updateFeedOnly();updateCioPaperOnly();}
    else if(ST.tab==='leader')render();},300000);
  setInterval(loadTicker,60000);
}
boot();
</script>
